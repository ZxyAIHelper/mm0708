<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">产品前后对比模板封面</title>
  <desc id="desc">左右分屏展示产品使用前和使用后的明显变化</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eee8"/>
      <stop offset="1" stop-color="#eaded3"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4eb"/>
      <stop offset="1" stop-color="#ffd1ba"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7f4634" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="38" fill="url(#bg)"/>
  <text x="48" y="72" fill="#412e29" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700">效果一眼看得见</text>
  <g filter="url(#shadow)">
    <rect x="46" y="108" width="508" height="406" rx="28" fill="#fff"/>
  </g>
  <path d="M300 108h226a28 28 0 0 1 28 28v350a28 28 0 0 1-28 28H300z" fill="url(#after)"/>
  <line x1="300" y1="132" x2="300" y2="490" stroke="#fff" stroke-width="8"/>
  <rect x="74" y="138" width="104" height="42" rx="21" fill="#77716d"/>
  <text x="126" y="167" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700">使用前</text>
  <rect x="326" y="138" width="104" height="42" rx="21" fill="#d74a3f"/>
  <text x="378" y="167" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700">使用后</text>
  <g opacity=".68">
    <ellipse cx="178" cy="412" rx="92" ry="22" fill="#bdb5af"/>
    <rect x="122" y="242" width="112" height="164" rx="22" fill="#b7b2af"/>
    <rect x="142" y="214" width="72" height="48" rx="13" fill="#a7a19d"/>
    <path d="M142 306h72M142 334h72M142 362h48" stroke="#e6e1dd" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g>
    <ellipse cx="422" cy="420" rx="104" ry="25" fill="#e9a48a" opacity=".42"/>
    <rect x="356" y="224" width="132" height="188" rx="26" fill="#e75c4c"/>
    <rect x="380" y="190" width="84" height="56" rx="16" fill="#b83234"/>
    <circle cx="422" cy="313" r="42" fill="#fff1d8"/>
    <path d="M394 314c18-30 45-33 59-6-10 27-38 38-59 6z" fill="#f0a84b"/>
    <path d="M414 285c4-17 18-24 31-19" fill="none" stroke="#47885f" stroke-width="9" stroke-linecap="round"/>
    <path d="M378 372h88" stroke="#ffd7c8" stroke-width="12" stroke-linecap="round"/>
  </g>
  <circle cx="300" cy="310" r="38" fill="#fff"/>
  <path d="M284 310h30m-12-12 12 12-12 12" fill="none" stroke="#d74a3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="558" text-anchor="middle" fill="#7b5a50" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23">同角度 · 强对比 · 好展示</text>
</svg>
