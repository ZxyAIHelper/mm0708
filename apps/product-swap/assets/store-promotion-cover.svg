  <rect x="239" y="279" width="86" height="98" rx="8" fill="#91b7ad"/>
  <path d="M250 327h64M282 289v77" stroke="#dcefe9" stroke-width="8"/>
  <rect x="143" y="304" width="58" height="74" rx="6" fill="#f3d9ad"/>
  <circle cx="188" cy="363" r="5" fill="#7d4b3d"/>
  <rect x="112" y="128" width="230" height="54" rx="12" fill="#4c3432"/>
