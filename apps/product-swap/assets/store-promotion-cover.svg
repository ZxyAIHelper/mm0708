      <stop offset="1" stop-color="#d94852"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#812833" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="38" fill="url(#bg)"/>
  <circle cx="88" cy="88" r="54" fill="#ffd975" opacity=".32"/>
  <circle cx="520" cy="516" r="94" fill="#7b1f37" opacity=".13"/>
