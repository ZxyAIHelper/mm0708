  <g filter="url(#shadow)">
    <rect x="54" y="107" width="300" height="354" rx="28" fill="#fffaf0"/>
  </g>
  <rect x="76" y="129" width="256" height="223" rx="20" fill="#c7eee5"/>
  <ellipse cx="204" cy="323" rx="77" ry="15" fill="#4d9f9d" opacity=".28"/>
