  <path d="M209 177l36-67" stroke="#e85d68" stroke-width="10" stroke-linecap="round"/>
  <circle cx="193" cy="231" r="19" fill="#fff3a6" opacity=".8"/>
  <circle cx="225" cy="278" r="14" fill="#fff3a6" opacity=".72"/>
  <path d="M126 264c-34-35-32-73 7-92 37 25 38 64-7 92zm158-7c37-29 42-66 8-91-40 19-47 58-8 91z" fill="#60a66d"/>
