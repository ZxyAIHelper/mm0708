    <text x="22" y="88" fill="#245d62" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="800">一口喝到</text>
    <text x="22" y="119" fill="#245d62" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="800">整个夏天</text>
    <path d="M24 146h82" stroke="#abd5ca" stroke-width="8" stroke-linecap="round"/>
