<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">夏日产品种草模板封面</title>
  <desc id="desc">清爽夏日饮品、阳光和绿叶组成的社交平台种草封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8eee8"/>
      <stop offset=".55" stop-color="#78cfc8"/>
      <stop offset="1" stop-color="#3d9ea3"/>
    </linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9c7"/>
      <stop offset="1" stop-color="#f4a64b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#246d72" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="38" fill="url(#bg)"/>
  <circle cx="490" cy="102" r="64" fill="#ffe178"/>
