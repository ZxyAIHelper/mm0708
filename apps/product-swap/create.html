<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>爆款场景同款图</title>
    <meta
        name="description"
        content="保留参考图的构图，把画面主体替换成你的产品。"
    >
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="product-swap-shell">
        <nav class="top-nav" aria-label="页面导航">
            <button
                class="back-button"
                id="backButton"
                type="button"
            >← 返回</button>
            <a
                class="history-link"
                id="historyLink"
                href="/history.html"
            >任务记录</a>
        </nav>

        <header class="intro">
            <h1 id="creatorTitle">爆款场景同款图</h1>
            <p id="creatorSummary">
                保留参考图的构图，把画面主体替换成你的产品。
            </p>
            <p class="tip" id="creatorTip">
                提示：样图尽量避免含文字、品牌或水印，可能被 AI 安全系统拒绝。
            </p>
        </header>

        <section
            class="example-card"
            aria-labelledby="exampleTitle"
        >
            <p id="exampleTitle">
                效果示例 · 样图换成你的产品
            </p>
            <div class="example-equation">
                <figure>
                    <img
                        src="/assets/example-template.jpg"
                        alt="样图模板"
                    >
                    <figcaption>① 样图模板</figcaption>
                </figure>
                <span aria-hidden="true">+</span>
                <figure>
                    <img
                        src="/assets/example-product.jpg"
                        alt="你的产品"
                    >
                    <figcaption>② 你的产品</figcaption>
                </figure>
                <span aria-hidden="true">=</span>
                <figure>
                    <img
                        src="/assets/example-result.jpg"
                        alt="换好的效果"
                    >
                    <figcaption>③ 换好的效果</figcaption>
                </figure>
            </div>
        </section>

        <form id="swapForm" novalidate>
            <div
                id="templateFields"
                class="template-fields"
            ></div>

            <p
                id="formError"
                class="form-error"
                role="alert"
                hidden
            ></p>

            <button
                id="generateButton"
                class="generate-button"
                type="submit"
            >生成（消耗 3 豆额度）</button>
        </form>

        <section
            id="resultSection"
            class="result-card"
            hidden
        >
            <img id="resultImage" alt="换品结果">
            <div
                id="versionRail"
                class="version-rail"
                aria-label="生成版本"
            ></div>
            <div class="result-actions">
                <button
                    id="regenerateButton"
                    type="button"
                >再次生成</button>
                <button
                    id="downloadButton"
                    type="button"
                >下载图片</button>
            </div>
            <p
                id="archiveNotice"
                class="archive-notice"
                role="status"
                hidden
            ></p>
            <div class="refinement-panel">
                <div class="refinement-heading">
                    <h2>继续对话修改</h2>
                    <span>AI 会基于上一版继续调整</span>
                </div>
                <div
                    id="chatTimeline"
                    class="chat-timeline"
                    aria-live="polite"
                ></div>
                <div
                    id="quickPrompts"
                    class="quick-prompts"
                    aria-label="快捷修改"
                ></div>
                <form id="refineForm" class="refine-form">
                    <textarea
                        id="refineInput"
                        maxlength="500"
                        placeholder="例如：盘子改成白色，菜品和构图都不要变"
                    ></textarea>
                    <button
                        id="refineButton"
                        type="submit"
                    >发送并生成新版本</button>
                </form>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
        <a href="/" data-nav="home">
            <span aria-hidden="true">⌂</span>首页
        </a>
        <a
            class="active"
            href="/create.html?template=product-swap"
            data-nav="create"
            aria-current="page"
        >
            <span aria-hidden="true">＋</span>创作
        </a>
        <a href="/history.html" data-nav="works">
            <span aria-hidden="true">▤</span>作品
        </a>
        <a href="/profile.html" data-nav="profile">
            <span aria-hidden="true">○</span>我的
        </a>
    </nav>

    <script src="/template-catalog.js"></script>
    <script src="/templates.js"></script>
    <script src="/chat-materials.js"></script>
    <script src="/creator-form.js"></script>
    <script src="/creator-meta.js"></script>
    <script src="/api-client.js"></script>
    <script src="/tencent-map-picker.js"></script>
    <script src="/chat-draft-client.js"></script>
    <script src="/wechat-chat-renderer.js"></script>
    <script src="/wechat-chat-editor.js"></script>
    <script src="/dish-library-client.js"></script>
    <script src="/dish-ranking-client.js"></script>
    <script src="/dish-ranking-renderer.js"></script>
    <script src="/local-history.js"></script>
    <script src="/version-history.js"></script>
    <script src="/script.js"></script>
</body>
</html>
