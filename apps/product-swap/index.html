<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商家内容助手</title>
    <meta
        name="description"
        content="使用热点模板生成小红书和抖音图文内容。"
    >
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <main class="app-shell home-shell">
        <header class="home-header">
            <div class="heading-row">
                <div>
                    <p class="eyebrow">商家内容助手</p>
                    <h1>今天想发什么？</h1>
                </div>
                <a id="shopSummary" class="shop-summary" href="/profile.html">完善店铺</a>
            </div>

            <form id="templateSearch" class="template-search" role="search">
                <label for="templateSearchInput">输入产品、活动或推广需求</label>
                <div class="search-row">
                    <input
                        id="templateSearchInput"
                        type="search"
                        placeholder="例如：周末新品蛋糕"
                    >
                    <button type="submit">找模板</button>
                </div>
            </form>
        </header>

        <section id="quickTasks" class="home-section" aria-labelledby="quickTasksTitle">
            <div class="section-heading">
                <h2 id="quickTasksTitle">快捷创作</h2>
            </div>
            <div class="quick-task-grid">
                <a class="quick-task quick-task-primary" href="/create.html?template=product-swap">
                    <span aria-hidden="true">↗</span>
                    推广产品
                </a>
                <button class="quick-task" type="button" data-query="门店">
                    <span aria-hidden="true">⌂</span>
                    宣传门店
                </button>
                <button class="quick-task" type="button" data-query="活动">
                    <span aria-hidden="true">％</span>
                    做活动图
                </button>
                <button class="quick-task" type="button" data-query="背景">
                    <span aria-hidden="true">▧</span>
                    改造已有图片
                </button>
            </div>
        </section>

        <section class="home-section" aria-labelledby="hotTemplatesTitle">
            <div class="section-heading">
                <h2 id="hotTemplatesTitle">今日热点</h2>
            </div>
            <div id="hotTemplates" class="hot-template-list"></div>
        </section>

        <section class="home-section templates-section" aria-labelledby="allTemplatesTitle">
            <div class="section-heading">
                <h2 id="allTemplatesTitle">全部模板</h2>
            </div>
            <div
                id="templateCategories"
                class="template-categories"
                aria-label="模板分类"
            ></div>
            <div id="templateGrid" class="template-grid"></div>
            <div id="homeEmpty" class="home-empty" hidden>
                <h3>暂时没有完全匹配的模板</h3>
                <p>试试“产品”“门店”“活动”或“背景”</p>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="主要导航">
        <a class="is-active" href="/" data-nav="home" aria-current="page">
            <span aria-hidden="true">⌂</span>首页
        </a>
        <a href="/create.html" data-nav="create">
            <span aria-hidden="true">＋</span>创作
        </a>
        <a href="/history.html" data-nav="history">
            <span aria-hidden="true">▤</span>作品
        </a>
        <a href="/profile.html" data-nav="profile">
            <span aria-hidden="true">○</span>我的
        </a>
    </nav>

    <script src="/templates.js"></script>
    <script src="/merchant-store.js"></script>
    <script src="/home.js"></script>
</body>
</html>
