name = "my-cloud-hub"
compatibility_date = "2026-07-17"
compatibility_flags = [ "nodejs_compat" ]

[vars]
DOUBAO_CHAT_ENDPOINT = "ep-20260716231326-d56zl"
DOUBAO_IMAGE_ENDPOINT_ID = "ep-20260107231748-q2sw8"
DOUBAO_PRODUCT_SWAP_ENDPOINT_ID = "ep-20260107231748-q2sw8"
DOUBAO_ARK_BASE_URL = "https://ark.cn-beijing.volces.com/api/v3"

[secrets]
required = [ "DOUBAO_API_KEY" ]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "my-db"
database_id = "0b58d184-7a8d-4711-92a9-30d338a0b418"
migrations_dir = "../../packages/database/migrations"

[[kv_namespaces]]
binding = "WECHAT_KV"
id = "a95d6ea52307466e85bbb150aea487c6"

[[r2_buckets]]
binding = "TASK_ASSETS"
bucket_name = "my-cloud-hub-task-assets"

[[vectorize]]
binding = "VECTORIZE"
index_name = "todo-tasks"

[[durable_objects.bindings]]
name = "BLOCK_DUEL_ROOM"
class_name = "BlockDuelRoom"

[[migrations]]
tag = "v1_block_duel_room"
new_sqlite_classes = [ "BlockDuelRoom" ]

[triggers]
crons = [ "0 3 * * *" ]
