<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .bone { stroke: #ffd700; stroke-width: 2; stroke-linecap: round; fill: none; }
            .joint { fill: #ffd700; }
        </style>
    </defs>
    
    <!-- Body (Tilted) -->
    <line x1="32" y1="20" x2="32" y2="45" class="bone" transform="rotate(-15 32 32)" />
    
    <!-- Head -->
    <circle cx="32" cy="14" r="5" class="bone" transform="rotate(-15 32 32)" />
    
    <!-- Arms (Spread but Banked) -->
    <!-- Left High -->
    <line x1="32" y1="22" x2="8" y2="10" class="bone" />
    <!-- Right Low -->
    <line x1="32" y1="22" x2="56" y2="34" class="bone" />
    
    <!-- Legs -->
    <line x1="32" y1="45" x2="22" y2="60" class="bone" transform="rotate(-15 32 32)" />
    <line x1="32" y1="45" x2="42" y2="60" class="bone" transform="rotate(-15 32 32)" />
    
    <!-- Joints -->
    <circle cx="32" cy="22" r="2" class="joint" />
    <circle cx="8" cy="10" r="2" class="joint" />
    <circle cx="56" cy="34" r="2" class="joint" />
</svg>
