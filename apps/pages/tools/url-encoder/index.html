<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL编码解码</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #64748b;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-bg: #f8fafc;
            --dark-bg: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--light-bg);
        }

        /* 导航栏 */
        nav {
            background-color: var(--card-bg);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 页面标题 */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* 工具容器 */
        .tool-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* 工具工具栏 */
        .tool-toolbar {
            background-color: var(--light-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 0.5rem 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .toolbar-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary:hover {
            background-color: #4338ca;
        }

        /* 工具内容区域 */
        .tool-content {
            padding: 1rem;
        }

        /* 输入输出区域 */
        .io-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        /* 面板 */
        .panel {
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        /* 文本区域 */
        .text-area {
            width: 100%;
            height: 400px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            resize: vertical;
            transition: var(--transition);
        }

        .text-area:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .text-area.readonly {
            background-color: var(--light-bg);
            cursor: not-allowed;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        /* 消息区域 */
        .message-container {
            margin-bottom: 1rem;
        }

        /* 错误信息 */
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--danger-color);
        }

        /* 成功信息 */
        .success-message {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--success-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .io-container {
                grid-template-columns: 1fr;
            }

            .text-area {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <a href="../../index.html" class="logo">工具门户</a>
            <ul class="nav-links">
                <li><a href="../../index.html" class="nav-link">首页</a></li>
                <li><a href="../markdown-editor/index.html" class="nav-link">Markdown编辑器</a></li>
                <li><a href="../base64-converter/index.html" class="nav-link">Base64编解码</a></li>
                <li><a href="../json-formatter/index.html" class="nav-link">JSON格式化</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 class="page-title">URL编码解码</h1>
        <p class="page-subtitle">在线URL编码和解码工具，支持各种特殊字符处理</p>

        <!-- 工具容器 -->
        <div class="tool-container">
            <!-- 工具栏 -->
            <div class="tool-toolbar">
                <button class="toolbar-btn primary" id="encodeBtn">编码</button>
                <button class="toolbar-btn" id="decodeBtn">解码</button>
                <button class="toolbar-btn" id="copyBtn">复制结果</button>
                <button class="toolbar-btn" id="clearBtn">清空</button>
                <button class="toolbar-btn" id="swapBtn">交换</button>
            </div>

            <!-- 工具内容 -->
            <div class="tool-content">
                <!-- 消息区域 -->
                <div class="message-container" id="messageContainer"></div>

                <!-- 输入输出区域 -->
                <div class="io-container">
                    <!-- 输入面板 -->
                    <div class="panel">
                        <h3 class="panel-title">输入</h3>
                        <textarea class="text-area" id="inputText" placeholder="请输入要编码或解码的URL...">https://example.com/?name=工具门户&category=development&page=1</textarea>
                    </div>

                    <!-- 输出面板 -->
                    <div class="panel">
                        <h3 class="panel-title">输出</h3>
                        <textarea class="text-area readonly" id="outputText" placeholder="结果将显示在这里..." readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 显示消息
        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}-message">${message}</div>`;
            
            // 3秒后自动隐藏
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // URL编码
        function urlEncode() {
            const input = document.getElementById('inputText');
            const output = document.getElementById('outputText');
            
            try {
                output.value = encodeURIComponent(input.value);
                showMessage('URL编码成功！', 'success');
            } catch (error) {
                showMessage('编码错误: ' + error.message, 'error');
            }
        }

        // URL解码
        function urlDecode() {
            const input = document.getElementById('inputText');
            const output = document.getElementById('outputText');
            
            try {
                output.value = decodeURIComponent(input.value);
                showMessage('URL解码成功！', 'success');
            } catch (error) {
                showMessage('解码错误: ' + error.message, 'error');
            }
        }

        // 复制结果
        function copyResult() {
            const output = document.getElementById('outputText');
            
            if (!output.value) {
                showMessage('没有可复制的内容！', 'warning');
                return;
            }
            
            output.select();
            output.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                showMessage('复制成功！', 'success');
            } catch (error) {
                showMessage('复制失败: ' + error.message, 'error');
            }
        }

        // 清空
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('messageContainer').innerHTML = '';
        }

        // 交换输入输出
        function swapInputOutput() {
            const input = document.getElementById('inputText');
            const output = document.getElementById('outputText');
            const temp = input.value;
            input.value = output.value;
            output.value = temp;
            showMessage('已交换输入输出！', 'success');
        }

        // 事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            // 编码按钮
            document.getElementById('encodeBtn').addEventListener('click', urlEncode);
            
            // 解码按钮
            document.getElementById('decodeBtn').addEventListener('click', urlDecode);
            
            // 复制按钮
            document.getElementById('copyBtn').addEventListener('click', copyResult);
            
            // 清空按钮
            document.getElementById('clearBtn').addEventListener('click', clearAll);
            
            // 交换按钮
            document.getElementById('swapBtn').addEventListener('click', swapInputOutput);
        });
    </script>
</body>
</html>
