<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码格式化</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #64748b;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-bg: #f8fafc;
            --dark-bg: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--light-bg);
        }

        /* 导航栏 */
        nav {
            background-color: var(--card-bg);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 页面标题 */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* 工具容器 */
        .tool-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* 工具工具栏 */
        .tool-toolbar {
            background-color: var(--light-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .toolbar-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .language-select {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            background-color: var(--card-bg);
            color: var(--text-primary);
        }

        .language-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .toolbar-btn {
            padding: 0.5rem 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .toolbar-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary:hover {
            background-color: #4338ca;
        }

        /* 工具内容区域 */
        .tool-content {
            padding: 1rem;
        }

        /* 输入输出区域 */
        .io-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        /* 面板 */
        .panel {
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        /* 代码编辑器 */
        .code-editor {
            width: 100%;
            height: 500px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            resize: vertical;
            transition: var(--transition);
            background-color: var(--dark-bg);
            color: #e2e8f0;
            tab-size: 2;
        }

        .code-editor:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .code-editor.readonly {
            background-color: #1e293b;
            cursor: not-allowed;
        }

        /* 消息区域 */
        .message-container {
            margin-bottom: 1rem;
        }

        /* 错误信息 */
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--danger-color);
        }

        /* 成功信息 */
        .success-message {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--success-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .io-container {
                grid-template-columns: 1fr;
            }

            .code-editor {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <a href="../../index.html" class="logo">工具门户</a>
            <ul class="nav-links">
                <li><a href="../../index.html" class="nav-link">首页</a></li>
                <li><a href="../markdown-editor/index.html" class="nav-link">Markdown编辑器</a></li>
                <li><a href="../base64-converter/index.html" class="nav-link">Base64编解码</a></li>
                <li><a href="../json-formatter/index.html" class="nav-link">JSON格式化</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 class="page-title">代码格式化</h1>
        <p class="page-subtitle">支持多种编程语言的代码格式化和美化</p>

        <!-- 工具容器 -->
        <div class="tool-container">
            <!-- 工具栏 -->
            <div class="tool-toolbar">
                <div class="toolbar-group">
                    <span class="toolbar-label">语言:</span>
                    <select class="language-select" id="languageSelect">
                        <option value="javascript">JavaScript</option>
                        <option value="json">JSON</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="php">PHP</option>
                        <option value="ruby">Ruby</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                    </select>
                </div>
                
                <div class="toolbar-group">
                    <button class="toolbar-btn primary" id="formatBtn">格式化</button>
                    <button class="toolbar-btn" id="copyBtn">复制结果</button>
                    <button class="toolbar-btn" id="clearBtn">清空</button>
                    <button class="toolbar-btn" id="swapBtn">交换</button>
                </div>
            </div>

            <!-- 工具内容 -->
            <div class="tool-content">
                <!-- 消息区域 -->
                <div class="message-container" id="messageContainer"></div>

                <!-- 输入输出区域 -->
                <div class="io-container">
                    <!-- 输入面板 -->
                    <div class="panel">
                        <h3 class="panel-title">输入代码</h3>
                        <textarea class="code-editor" id="inputCode" placeholder="请输入代码...">function hello() {
console.log('Hello, World!');
const arr = [1,2,3,4,5];
for(let i=0;i<arr.length;i++){
if(arr[i]%2===0){
console.log(arr[i] + '是偶数');
}else{
console.log(arr[i] + '是奇数');
}
}
}</textarea>
                    </div>

                    <!-- 输出面板 -->
                    <div class="panel">
                        <h3 class="panel-title">格式化代码</h3>
                        <textarea class="code-editor readonly" id="outputCode" placeholder="格式化结果将显示在这里..." readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 显示消息
        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}-message">${message}</div>`;
            
            // 3秒后自动隐藏
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // 代码格式化函数
        function formatCode(code, language) {
            try {
                switch (language) {
                    case 'json':
                        // JSON格式化
                        const parsed = JSON.parse(code);
                        return JSON.stringify(parsed, null, 2);
                    case 'javascript':
                        return formatJavaScript(code);
                    case 'html':
                        return formatHTML(code);
                    case 'css':
                        return formatCSS(code);
                    case 'python':
                        return formatPython(code);
                    default:
                        // 其他语言使用简单的缩进格式化
                        return formatGeneric(code);
                }
            } catch (error) {
                throw new Error(`格式化错误: ${error.message}`);
            }
        }

        // JavaScript格式化
        function formatJavaScript(code) {
            let indent = 0;
            let result = '';
            let inString = false;
            let stringChar = '';
            let inComment = false;
            let inMultiLineComment = false;
            
            for (let i = 0; i < code.length; i++) {
                const char = code[i];
                const nextChar = code[i + 1];
                
                // 处理字符串
                if (!inComment && !inMultiLineComment) {
                    if ((char === '"' || char === "'") && (i === 0 || code[i - 1] !== '\\')) {
                        if (!inString) {
                            inString = true;
                            stringChar = char;
                        } else if (char === stringChar) {
                            inString = false;
                        }
                    }
                }
                
                // 处理单行注释
                if (!inString && !inComment && !inMultiLineComment && char === '/' && nextChar === '/') {
                    inComment = true;
                }
                
                if (inComment && char === '\n') {
                    inComment = false;
                }
                
                // 处理多行注释
                if (!inString && !inComment && !inMultiLineComment && char === '/' && nextChar === '*') {
                    inMultiLineComment = true;
                }
                
                if (inMultiLineComment && char === '*' && nextChar === '/') {
                    inMultiLineComment = false;
                    result += '*/';
                    i++;
                    continue;
                }
                
                // 处理缩进
                if (!inString && !inComment && !inMultiLineComment) {
                    if (char === '{' || char === '[' || char === '(') {
                        result += char;
                        indent++;
                        result += '\n' + '  '.repeat(indent);
                        continue;
                    }
                    
                    if (char === '}' || char === ']' || char === ')') {
                        indent--;
                        result += '\n' + '  '.repeat(indent) + char;
                        if (nextChar && nextChar !== ';' && nextChar !== ',' && nextChar !== '}' && nextChar !== ']' && nextChar !== ')') {
                            result += ' ';
                        }
                        continue;
                    }
                    
                    if (char === ';' || char === ',') {
                        result += char;
                        if (nextChar && nextChar !== '}' && nextChar !== ']' && nextChar !== ')') {
                            result += '\n' + '  '.repeat(indent);
                        }
                        continue;
                    }
                    
                    if (char === '\n') {
                        result += '\n' + '  '.repeat(indent);
                        continue;
                    }
                }
                
                if (!inComment && !inMultiLineComment || (inComment && char === '\n')) {
                    result += char;
                } else if (inMultiLineComment) {
                    result += char;
                }
            }
            
            return result.trim();
        }

        // HTML格式化
        function formatHTML(code) {
            let indent = 0;
            let result = '';
            let tagStack = [];
            let text = '';
            
            // 简单的HTML格式化
            code = code.replace(/\s+/g, ' ').trim();
            
            const tags = code.match(/<[^>]+>/g) || [];
            
            for (let tag of tags) {
                const tagName = tag.match(/<\/?([a-zA-Z][a-zA-Z0-9]*)/);
                if (tagName) {
                    const name = tagName[1].toLowerCase();
                    const isClosing = tag.startsWith('</');
                    const isSelfClosing = tag.endsWith('/>');
                    
                    if (isClosing) {
                        indent--;
                        result += '\n' + '  '.repeat(indent) + tag;
                        tagStack.pop();
                    } else {
                        result += '\n' + '  '.repeat(indent) + tag;
                        if (!isSelfClosing && !['br', 'hr', 'img', 'input', 'meta', 'link'].includes(name)) {
                            tagStack.push(name);
                            indent++;
                        }
                    }
                }
            }
            
            return result.trim();
        }

        // CSS格式化
        function formatCSS(code) {
            let indent = 0;
            let result = '';
            
            for (let i = 0; i < code.length; i++) {
                const char = code[i];
                
                if (char === '{') {
                    result += ' {';
                    indent++;
                    result += '\n' + '  '.repeat(indent);
                } else if (char === '}') {
                    indent--;
                    result += '\n' + '  '.repeat(indent) + '}';
                    if (code[i + 1] && code[i + 1] !== '}') {
                        result += '\n';
                    }
                } else if (char === ';') {
                    result += ';\n' + '  '.repeat(indent);
                } else if (char === '\n' || char === '\t' || char === ' ') {
                    continue;
                } else {
                    result += char;
                }
            }
            
            return result.trim();
        }

        // Python格式化
        function formatPython(code) {
            let indent = 0;
            let result = '';
            
            const lines = code.split('\n');
            for (let line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                
                // 处理缩进
                if (trimmed.startsWith('if') || trimmed.startsWith('for') || trimmed.startsWith('while') || trimmed.startsWith('def') || trimmed.startsWith('class') || trimmed.endsWith(':')) {
                    result += '  '.repeat(indent) + trimmed + '\n';
                    if (trimmed.endsWith(':')) {
                        indent++;
                    }
                } else if (trimmed.startsWith('return') || trimmed.startsWith('break') || trimmed.startsWith('continue') || trimmed.startsWith('pass') || trimmed.startsWith('else') || trimmed.startsWith('elif')) {
                    if (trimmed.startsWith('else') || trimmed.startsWith('elif')) {
                        indent--;
                    }
                    result += '  '.repeat(indent) + trimmed + '\n';
                    if (trimmed.endsWith(':')) {
                        indent++;
                    }
                } else {
                    result += '  '.repeat(indent) + trimmed + '\n';
                }
            }
            
            return result.trim();
        }

        // 通用格式化
        function formatGeneric(code) {
            let indent = 0;
            let result = '';
            
            for (let i = 0; i < code.length; i++) {
                const char = code[i];
                
                if (char === '{' || char === '[' || char === '(') {
                    result += char;
                    result += '\n' + '  '.repeat(++indent);
                } else if (char === '}' || char === ']' || char === ')') {
                    result += '\n' + '  '.repeat(--indent) + char;
                } else if (char === ';') {
                    result += ';' + '\n' + '  '.repeat(indent);
                } else if (char === '\n') {
                    result += '\n' + '  '.repeat(indent);
                } else if (char !== '\t') {
                    result += char;
                }
            }
            
            return result.trim();
        }

        // 格式化代码
        function formatCodeHandler() {
            const inputCode = document.getElementById('inputCode');
            const outputCode = document.getElementById('outputCode');
            const languageSelect = document.getElementById('languageSelect');
            
            try {
                const formatted = formatCode(inputCode.value, languageSelect.value);
                outputCode.value = formatted;
                showMessage('代码格式化成功！', 'success');
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        // 复制结果
        function copyResult() {
            const outputCode = document.getElementById('outputCode');
            
            if (!outputCode.value) {
                showMessage('没有可复制的内容！', 'warning');
                return;
            }
            
            outputCode.select();
            outputCode.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                showMessage('代码已复制到剪贴板！', 'success');
            } catch (error) {
                showMessage('复制失败: ' + error.message, 'error');
            }
        }

        // 清空
        function clearAll() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
            document.getElementById('messageContainer').innerHTML = '';
            showMessage('已清空代码！', 'success');
        }

        // 交换输入输出
        function swapInputOutput() {
            const inputCode = document.getElementById('inputCode');
            const outputCode = document.getElementById('outputCode');
            const temp = inputCode.value;
            inputCode.value = outputCode.value;
            outputCode.value = temp;
            showMessage('已交换输入输出！', 'success');
        }

        // 事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            // 格式化按钮
            document.getElementById('formatBtn').addEventListener('click', formatCodeHandler);
            
            // 复制按钮
            document.getElementById('copyBtn').addEventListener('click', copyResult);
            
            // 清空按钮
            document.getElementById('clearBtn').addEventListener('click', clearAll);
            
            // 交换按钮
            document.getElementById('swapBtn').addEventListener('click', swapInputOutput);
        });
    </script>
</body>
</html>
