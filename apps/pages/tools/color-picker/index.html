<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色选择器</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #64748b;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-bg: #f8fafc;
            --dark-bg: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--light-bg);
        }

        /* 导航栏 */
        nav {
            background-color: var(--card-bg);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 页面标题 */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* 工具容器 */
        .tool-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* 工具工具栏 */
        .tool-toolbar {
            background-color: var(--light-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 0.5rem 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .toolbar-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary:hover {
            background-color: #4338ca;
        }

        /* 工具内容区域 */
        .tool-content {
            padding: 2rem;
        }

        /* 颜色选择区域 */
        .color-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        /* 颜色预览 */
        .color-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .color-display {
            width: 300px;
            height: 300px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            margin-bottom: 1rem;
            background-color: #3b82f6;
            position: relative;
            overflow: hidden;
        }

        .color-picker {
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* 颜色值显示 */
        .color-values {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .color-value-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background-color: var(--light-bg);
            border-radius: var(--border-radius);
        }

        .color-value-label {
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 100px;
        }

        .color-value-input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
        }

        .color-value-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .copy-btn {
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .copy-btn:hover {
            background-color: #4338ca;
        }

        /* 预设颜色 */
        .preset-colors {
            margin-top: 2rem;
        }

        .preset-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 0.5rem;
        }

        .preset-color {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border-color);
            transition: var(--transition);
        }

        .preset-color:hover {
            transform: scale(1.1);
            border-color: var(--primary-color);
        }

        /* 消息区域 */
        .message-container {
            margin-bottom: 1rem;
        }

        /* 错误信息 */
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--danger-color);
        }

        /* 成功信息 */
        .success-message {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--success-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .color-container {
                grid-template-columns: 1fr;
            }

            .color-display {
                width: 100%;
                max-width: 300px;
            }

            .color-value-item {
                flex-direction: column;
                align-items: stretch;
            }

            .color-value-label {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <a href="../../index.html" class="logo">工具门户</a>
            <ul class="nav-links">
                <li><a href="../../index.html" class="nav-link">首页</a></li>
                <li><a href="../markdown-editor/index.html" class="nav-link">Markdown编辑器</a></li>
                <li><a href="../base64-converter/index.html" class="nav-link">Base64编解码</a></li>
                <li><a href="../json-formatter/index.html" class="nav-link">JSON格式化</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 class="page-title">颜色选择器</h1>
        <p class="page-subtitle">在线颜色选择器，支持RGB、HEX、HSL等多种颜色格式</p>

        <!-- 工具容器 -->
        <div class="tool-container">
            <!-- 工具栏 -->
            <div class="tool-toolbar">
                <button class="toolbar-btn" id="randomBtn">随机颜色</button>
                <button class="toolbar-btn" id="copyAllBtn">复制所有值</button>
                <button class="toolbar-btn" id="clearBtn">重置</button>
            </div>

            <!-- 工具内容 -->
            <div class="tool-content">
                <!-- 消息区域 -->
                <div class="message-container" id="messageContainer"></div>

                <!-- 颜色选择区域 -->
                <div class="color-container">
                    <!-- 颜色预览 -->
                    <div class="color-preview">
                        <div class="color-display" id="colorDisplay">
                            <input type="color" class="color-picker" id="colorPicker" value="#3b82f6">
                        </div>
                    </div>

                    <!-- 颜色值显示 -->
                    <div class="color-values">
                        <!-- HEX值 -->
                        <div class="color-value-item">
                            <span class="color-value-label">HEX:</span>
                            <input type="text" class="color-value-input" id="hexInput" value="#3b82f6">
                            <button class="copy-btn" onclick="copyColorValue('hex')">复制</button>
                        </div>

                        <!-- RGB值 -->
                        <div class="color-value-item">
                            <span class="color-value-label">RGB:</span>
                            <input type="text" class="color-value-input" id="rgbInput" value="rgb(59, 130, 246)">
                            <button class="copy-btn" onclick="copyColorValue('rgb')">复制</button>
                        </div>

                        <!-- HSL值 -->
                        <div class="color-value-item">
                            <span class="color-value-label">HSL:</span>
                            <input type="text" class="color-value-input" id="hslInput" value="hsl(217, 90%, 59%)">
                            <button class="copy-btn" onclick="copyColorValue('hsl')">复制</button>
                        </div>
                    </div>
                </div>

                <!-- 预设颜色 -->
                <div class="preset-colors">
                    <h3 class="preset-title">预设颜色</h3>
                    <div class="preset-grid" id="presetGrid">
                        <!-- 预设颜色将通过JavaScript生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 预设颜色列表
        const presetColors = [
            '#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899',
            '#14b8a6', '#f97316', '#6366f1', '#84cc16', '#0ea5e9', '#f43f5e',
            '#06b6d4', '#a855f7', '#f59e0b', '#22c55e', '#ef4444', '#3b82f6'
        ];

        // 显示消息
        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}-message">${message}</div>`;
            
            // 3秒后自动隐藏
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // 复制颜色值
        function copyColorValue(type) {
            const inputs = {
                hex: document.getElementById('hexInput'),
                rgb: document.getElementById('rgbInput'),
                hsl: document.getElementById('hslInput')
            };
            
            const input = inputs[type];
            input.select();
            input.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                showMessage(`${type.toUpperCase()}值已复制到剪贴板！`, 'success');
            } catch (error) {
                showMessage('复制失败: ' + error.message, 'error');
            }
        }

        // 复制所有颜色值
        function copyAllValues() {
            const hex = document.getElementById('hexInput').value;
            const rgb = document.getElementById('rgbInput').value;
            const hsl = document.getElementById('hslInput').value;
            
            const allValues = `HEX: ${hex}\nRGB: ${rgb}\nHSL: ${hsl}`;
            
            navigator.clipboard.writeText(allValues).then(() => {
                showMessage('所有颜色值已复制到剪贴板！', 'success');
            }).catch(err => {
                showMessage('复制失败: ' + err.message, 'error');
            });
        }

        // 将HEX转换为RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // 将RGB转换为HSL
        function rgbToHsl(r, g, b) {
            r /= 255, g /= 255, b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max == min) {
                h = s = 0; // achromatic
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        // 将RGB转换为HEX
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        // 更新颜色显示
        function updateColorDisplay(color) {
            const colorDisplay = document.getElementById('colorDisplay');
            const colorPicker = document.getElementById('colorPicker');
            const hexInput = document.getElementById('hexInput');
            const rgbInput = document.getElementById('rgbInput');
            const hslInput = document.getElementById('hslInput');
            
            // 设置颜色选择器值
            colorPicker.value = color;
            
            // 设置颜色显示背景
            colorDisplay.style.backgroundColor = color;
            
            // 解析颜色
            const rgb = hexToRgb(color);
            if (rgb) {
                const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
                
                // 更新输入框值
                hexInput.value = color;
                rgbInput.value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
                hslInput.value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
            }
        }

        // 从颜色选择器更新
        function updateFromColorPicker() {
            const colorPicker = document.getElementById('colorPicker');
            updateColorDisplay(colorPicker.value);
        }

        // 从HEX输入更新
        function updateFromHexInput() {
            const hexInput = document.getElementById('hexInput');
            const hex = hexInput.value;
            if (/^#[0-9A-F]{6}$/i.test(hex)) {
                updateColorDisplay(hex);
            }
        }

        // 随机颜色
        function generateRandomColor() {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            updateColorDisplay(randomColor);
            showMessage('已生成随机颜色！', 'success');
        }

        // 重置颜色
        function resetColor() {
            updateColorDisplay('#3b82f6');
            showMessage('颜色已重置！', 'success');
        }

        // 生成预设颜色
        function generatePresetColors() {
            const presetGrid = document.getElementById('presetGrid');
            presetGrid.innerHTML = '';
            
            presetColors.forEach(color => {
                const presetColor = document.createElement('div');
                presetColor.className = 'preset-color';
                presetColor.style.backgroundColor = color;
                presetColor.onclick = () => {
                    updateColorDisplay(color);
                    showMessage('已选择预设颜色！', 'success');
                };
                presetGrid.appendChild(presetColor);
            });
        }

        // 事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            // 生成预设颜色
            generatePresetColors();
            
            // 颜色选择器事件
            document.getElementById('colorPicker').addEventListener('input', updateFromColorPicker);
            
            // HEX输入事件
            document.getElementById('hexInput').addEventListener('input', updateFromHexInput);
            
            // 随机颜色按钮
            document.getElementById('randomBtn').addEventListener('click', generateRandomColor);
            
            // 复制所有按钮
            document.getElementById('copyAllBtn').addEventListener('click', copyAllValues);
            
            // 重置按钮
            document.getElementById('clearBtn').addEventListener('click', resetColor);
        });
    </script>
</body>
</html>
