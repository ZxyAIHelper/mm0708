<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化 - 在线JSON编辑器</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="../../index.html" class="logo">工具门户</a>
            <ul class="nav-links">
                <li><a href="../../index.html" class="nav-link">首页</a></li>
                <li><a href="../markdown-editor/index.html" class="nav-link">Markdown编辑器</a></li>
                <li><a href="../base64-converter/index.html" class="nav-link">Base64编解码</a></li>
                <li>
                    <button class="dark-mode-toggle" id="darkModeToggle" title="切换深色模式">
                        🌙
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <h1 class="page-title">JSON格式化工具</h1>
        <p class="page-subtitle">在线JSON格式化、验证、编辑器 - 支持语法高亮、折叠展开、内联编辑</p>

        <!-- Tool Container -->
        <div class="tool-container">
            <!-- Toolbar -->
            <div class="tool-toolbar">
                <div class="view-tabs">
                    <button class="view-tab active" data-view="text">📝 文本模式</button>
                    <button class="view-tab" data-view="tree">🌳 树形视图</button>
                </div>

                <div class="toolbar-divider"></div>

                <button class="toolbar-btn primary" id="formatBtn">✨ 格式化</button>
                <button class="toolbar-btn" id="compressBtn">🗜️ 压缩</button>
                <button class="toolbar-btn" id="validateBtn">✓ 验证</button>
                <button class="toolbar-btn" id="copyBtn">📋 复制</button>
                <button class="toolbar-btn" id="clearBtn">🗑️ 清空</button>

                <div class="toolbar-divider"></div>

                <button class="toolbar-btn" id="expandAllBtn" style="display: none;">展开全部</button>
                <button class="toolbar-btn" id="collapseAllBtn" style="display: none;">折叠全部</button>

                <div class="toolbar-divider" id="treeDivider" style="display: none;"></div>

                <button class="toolbar-btn" id="searchBtn">🔍 搜索</button>
                <button class="toolbar-btn" id="uploadBtn">📁 上传文件</button>
                <button class="toolbar-btn" id="downloadBtn">💾 下载</button>

                <input type="file" id="fileInput" accept=".json,application/json">
            </div>

            <!-- Content -->
            <div class="tool-content">
                <!-- Message Container -->
                <div id="messageContainer"></div>

                <!-- Search Container -->
                <div class="search-container" id="searchContainer">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索JSON内容...">
                        <button class="toolbar-btn" id="searchNextBtn">下一个</button>
                        <button class="toolbar-btn" id="searchCloseBtn">关闭</button>
                        <span class="search-results" id="searchResults"></span>
                    </div>
                </div>

                <!-- Text Editor Mode -->
                <div class="text-editor-container active" id="textEditorContainer">
                    <div class="editor-wrapper">
                        <div class="editor-line-numbers" id="lineNumbers">1</div>
                        <textarea id="textEditor" spellcheck="false" placeholder="在此粘贴或输入JSON内容...">
{
  "name": "工具门户",
  "version": "2.0.0",
  "description": "功能强大的JSON格式化工具",
  "features": {
    "highlighting": true,
    "treeView": true,
    "editing": true,
    "collapsible": true
  },
  "tools": [
    {
      "name": "Markdown编辑器",
      "category": "development",
      "enabled": true
    },
    {
      "name": "Base64编解码",
      "category": "development",
      "enabled": true
    },
    {
      "name": "JSON格式化",
      "category": "development",
      "enabled": true
    }
  ],
  "statistics": {
    "users": 1000,
    "requests": 50000,
    "uptime": 99.9
  }
}</textarea>
                    </div>
                </div>

                <!-- Tree View Mode -->
                <div class="tree-view-container" id="treeViewContainer"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
