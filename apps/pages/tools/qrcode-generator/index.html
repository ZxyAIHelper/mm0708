<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #64748b;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-bg: #f8fafc;
            --dark-bg: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--light-bg);
        }

        /* 导航栏 */
        nav {
            background-color: var(--card-bg);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 页面标题 */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* 工具容器 */
        .tool-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* 工具工具栏 */
        .tool-toolbar {
            background-color: var(--light-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .toolbar-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .toolbar-input {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            background-color: var(--card-bg);
            color: var(--text-primary);
            width: 120px;
        }

        .toolbar-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .toolbar-btn {
            padding: 0.5rem 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .toolbar-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary:hover {
            background-color: #4338ca;
        }

        /* 工具内容区域 */
        .tool-content {
            padding: 1rem;
        }

        /* 输入输出区域 */
        .io-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        /* 面板 */
        .panel {
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        /* 文本输入 */
        .text-input {
            width: 100%;
            height: 200px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            background-color: var(--light-bg);
            color: var(--text-primary);
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* 二维码预览区域 */
        .qrcode-preview {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--light-bg);
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            min-height: 300px;
            padding: 2rem;
        }

        #qrcodeCanvas {
            max-width: 100%;
            max-height: 100%;
            background-color: white;
            padding: 1rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
        }

        /* 下载链接 */
        .download-section {
            margin-top: 1rem;
            text-align: center;
        }

        .download-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--success-color);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            transition: var(--transition);
        }

        .download-link:hover {
            background-color: #059669;
        }

        /* 消息区域 */
        .message-container {
            margin-bottom: 1rem;
        }

        /* 错误信息 */
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--danger-color);
        }

        /* 成功信息 */
        .success-message {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--success-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .io-container {
                grid-template-columns: 1fr;
            }

            .qrcode-preview {
                min-height: 250px;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <a href="../../index.html" class="logo">工具门户</a>
            <ul class="nav-links">
                <li><a href="../../index.html" class="nav-link">首页</a></li>
                <li><a href="../markdown-editor/index.html" class="nav-link">Markdown编辑器</a></li>
                <li><a href="../base64-converter/index.html" class="nav-link">Base64编解码</a></li>
                <li><a href="../json-formatter/index.html" class="nav-link">JSON格式化</a></li>
                <li><a href="../base-converter/index.html" class="nav-link">进制转换</a></li>
                <li><a href="../url-encoder/index.html" class="nav-link">URL编解码</a></li>
                <li><a href="../color-picker/index.html" class="nav-link">颜色选择器</a></li>
                <li><a href="../code-formatter/index.html" class="nav-link">代码格式化</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 class="page-title">二维码生成器</h1>
        <p class="page-subtitle">将文本转换为二维码，支持自定义尺寸和下载</p>

        <!-- 工具容器 -->
        <div class="tool-container">
            <!-- 工具栏 -->
            <div class="tool-toolbar">
                <div class="toolbar-group">
                    <span class="toolbar-label">尺寸:</span>
                    <input type="number" class="toolbar-input" id="sizeInput" min="100" max="1000" value="300">
                </div>
                
                <div class="toolbar-group">
                    <button class="toolbar-btn primary" id="generateBtn">生成二维码</button>
                    <button class="toolbar-btn" id="downloadBtn">下载二维码</button>
                    <button class="toolbar-btn" id="clearBtn">清空</button>
                </div>
            </div>

            <!-- 工具内容 -->
            <div class="tool-content">
                <!-- 消息区域 -->
                <div class="message-container" id="messageContainer"></div>

                <!-- 输入输出区域 -->
                <div class="io-container">
                    <!-- 输入面板 -->
                    <div class="panel">
                        <h3 class="panel-title">输入文本</h3>
                        <textarea class="text-input" id="textInput" placeholder="请输入要生成二维码的文本...">https://example.com</textarea>
                    </div>

                    <!-- 输出面板 -->
                    <div class="panel">
                        <h3 class="panel-title">二维码预览</h3>
                        <div class="qrcode-preview">
                            <canvas id="qrcodeCanvas"></canvas>
                        </div>
                        <div class="download-section" id="downloadSection" style="display: none;">
                            <a href="#" class="download-link" id="downloadLink">下载二维码</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // QRCode 生成算法 (简化版，支持基本文本)
        class QRCodeGenerator {
            constructor() {
                this.version = 1;
                this.errorCorrectionLevel = 'L';
                this.modules = [];
            }

            // 生成二维码矩阵
            generate(text) {
                // 简化实现，使用Canvas API绘制二维码
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 简单的二维码模拟
                const size = 21;
                canvas.width = size;
                canvas.height = size;
                
                // 清空画布
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, size, size);
                
                // 绘制定位图案
                ctx.fillStyle = 'black';
                
                // 左上角定位图案
                this.drawFinderPattern(ctx, 0, 0);
                // 右上角定位图案
                this.drawFinderPattern(ctx, size - 7, 0);
                // 左下角定位图案
                this.drawFinderPattern(ctx, 0, size - 7);
                
                // 绘制对齐图案
                this.drawAlignmentPattern(ctx, size - 9, size - 9);
                
                // 绘制定时图案
                for (let i = 8; i < size - 8; i++) {
                    ctx.fillRect(6, i, 1, 1);
                    ctx.fillRect(i, 6, 1, 1);
                }
                
                // 绘制数据区域 (简化版，实际需要编码)
                const data = this.encodeData(text);
                let index = 0;
                for (let row = 0; row < size; row++) {
                    for (let col = 0; col < size; col++) {
                        // 跳过定位图案和定时图案
                        if (this.isReserved(row, col)) continue;
                        
                        if (data[index % data.length] === 1) {
                            ctx.fillRect(col, row, 1, 1);
                        }
                        index++;
                    }
                }
                
                return canvas;
            }

            // 绘制定位图案
            drawFinderPattern(ctx, x, y) {
                // 外框
                ctx.fillRect(x, y, 7, 7);
                // 内框
                ctx.fillStyle = 'white';
                ctx.fillRect(x + 2, y + 2, 3, 3);
                // 中心点
                ctx.fillStyle = 'black';
                ctx.fillRect(x + 3, y + 3, 1, 1);
            }

            // 绘制对齐图案
            drawAlignmentPattern(ctx, x, y) {
                ctx.fillRect(x - 2, y - 2, 5, 5);
                ctx.fillStyle = 'white';
                ctx.fillRect(x - 1, y - 1, 3, 3);
                ctx.fillStyle = 'black';
                ctx.fillRect(x, y, 1, 1);
            }

            // 检查是否为保留区域
            isReserved(row, col) {
                // 定位图案区域
                if ((row < 7 && col < 7) || (row < 7 && col > 13) || (row > 13 && col < 7)) {
                    return true;
                }
                // 定时图案区域
                if (row === 6 || col === 6) {
                    return true;
                }
                return false;
            }

            // 编码数据 (简化版)
            encodeData(text) {
                const data = [];
                for (let i = 0; i < text.length; i++) {
                    const charCode = text.charCodeAt(i);
                    for (let j = 0; j < 8; j++) {
                        data.push((charCode >> (7 - j)) & 1);
                    }
                }
                return data;
            }
        }

        // 显示消息
        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}-message">${message}</div>`;
            
            // 3秒后自动隐藏
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // 生成二维码
        function generateQRCode() {
            const text = document.getElementById('textInput').value;
            const size = parseInt(document.getElementById('sizeInput').value);
            const canvas = document.getElementById('qrcodeCanvas');
            const downloadSection = document.getElementById('downloadSection');
            const downloadLink = document.getElementById('downloadLink');
            
            if (!text.trim()) {
                showMessage('请输入要生成二维码的文本！', 'error');
                return;
            }
            
            try {
                // 使用简化的QRCode生成器
                const qrGenerator = new QRCodeGenerator();
                const qrCanvas = qrGenerator.generate(text);
                
                // 调整画布大小
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // 清空画布
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, size, size);
                
                // 绘制二维码
                ctx.drawImage(qrCanvas, 0, 0, size, size);
                
                // 更新下载链接
                const dataUrl = canvas.toDataURL('image/png');
                downloadLink.href = dataUrl;
                downloadLink.download = `qrcode-${Date.now()}.png`;
                downloadSection.style.display = 'block';
                
                showMessage('二维码生成成功！', 'success');
            } catch (error) {
                showMessage('二维码生成失败: ' + error.message, 'error');
            }
        }

        // 下载二维码
        function downloadQRCode() {
            const downloadLink = document.getElementById('downloadLink');
            if (downloadLink.href === '#') {
                showMessage('请先生成二维码！', 'error');
                return;
            }
            downloadLink.click();
            showMessage('二维码下载成功！', 'success');
        }

        // 清空
        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('sizeInput').value = 300;
            const canvas = document.getElementById('qrcodeCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('downloadSection').style.display = 'none';
            document.getElementById('messageContainer').innerHTML = '';
            showMessage('已清空内容！', 'success');
        }

        // 事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            // 生成按钮
            document.getElementById('generateBtn').addEventListener('click', generateQRCode);
            
            // 下载按钮
            document.getElementById('downloadBtn').addEventListener('click', downloadQRCode);
            
            // 清空按钮
            document.getElementById('clearBtn').addEventListener('click', clearAll);
            
            // 文本输入变化时自动生成
            document.getElementById('textInput').addEventListener('input', generateQRCode);
            
            // 尺寸变化时自动生成
            document.getElementById('sizeInput').addEventListener('input', generateQRCode);
            
            // 初始生成
            generateQRCode();
        });
    </script>
</body>
</html>
