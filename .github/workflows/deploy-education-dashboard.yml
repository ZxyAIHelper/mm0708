name: Deploy Education Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/education-dashboard/**"
      - ".github/workflows/deploy-education-dashboard.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/education-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build OpenNext bundle
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
