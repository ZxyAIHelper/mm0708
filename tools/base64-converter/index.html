<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64编解码</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #64748b;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-bg: #f8fafc;
            --dark-bg: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--light-bg);
        }

        /* 导航栏 */
        nav {
            background-color: var(--card-bg);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 页面标题 */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* 工具容器 */
        .tool-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* 工具工具栏 */
        .tool-toolbar {
            background-color: var(--light-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 0.5rem 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .toolbar-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary:hover {
            background-color: #4338ca;
        }

        /* 工具内容区域 */
        .tool-content {
            padding: 1rem;
        }

        /* 输入输出区域 */
        .io-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        /* 面板 */
        .panel {
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        /* 文本区域 */
        .text-area {
            width: 100%;
            height: 400px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            resize: vertical;
            transition: var(--transition);
        }

        .text-area:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* 结果区域 */
        .result-container {
            margin-top: 1rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .io-container {
                grid-template-columns: 1fr;
            }

            .text-area {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <a href="../../index.html" class="logo">工具门户</a>
            <ul class="nav-links">
                <li><a href="../../index.html" class="nav-link">首页</a></li>
                <li><a href="../markdown-editor/index.html" class="nav-link">Markdown编辑器</a></li>
                <li><a href="../json-formatter/index.html" class="nav-link">JSON格式化</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 class="page-title">Base64编解码</h1>
        <p class="page-subtitle">在线Base64编码和解码工具，支持文本和文件转换</p>

        <!-- 工具容器 -->
        <div class="tool-container">
            <!-- 工具栏 -->
            <div class="tool-toolbar">
                <button class="toolbar-btn primary" id="encodeBtn">编码</button>
                <button class="toolbar-btn" id="decodeBtn">解码</button>
                <button class="toolbar-btn" id="copyBtn">复制结果</button>
                <button class="toolbar-btn" id="clearBtn">清空</button>
            </div>

            <!-- 工具内容 -->
            <div class="tool-content">
                <!-- 输入输出区域 -->
                <div class="io-container">
                    <!-- 输入面板 -->
                    <div class="panel">
                        <h3 class="panel-title">输入</h3>
                        <textarea class="text-area" id="inputText" placeholder="请输入要编码或解码的内容...">Hello, Base64编解码工具！
这是一个测试文本，用于演示Base64编码和解码功能。
支持多行文本处理。</textarea>
                    </div>

                    <!-- 输出面板 -->
                    <div class="panel">
                        <h3 class="panel-title">输出</h3>
                        <textarea class="text-area" id="outputText" placeholder="结果将显示在这里..." readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Base64编码函数
        function base64Encode(text) {
            try {
                return btoa(unescape(encodeURIComponent(text)));
            } catch (error) {
                return '编码错误: ' + error.message;
            }
        }

        // Base64解码函数
        function base64Decode(text) {
            try {
                return decodeURIComponent(escape(atob(text)));
            } catch (error) {
                return '解码错误: ' + error.message;
            }
        }

        // 编码按钮事件
        document.getElementById('encodeBtn').addEventListener('click', function() {
            const input = document.getElementById('inputText');
            const output = document.getElementById('outputText');
            output.value = base64Encode(input.value);
        });

        // 解码按钮事件
        document.getElementById('decodeBtn').addEventListener('click', function() {
            const input = document.getElementById('inputText');
            const output = document.getElementById('outputText');
            output.value = base64Decode(input.value);
        });

        // 复制结果事件
        document.getElementById('copyBtn').addEventListener('click', function() {
            const output = document.getElementById('outputText');
            output.select();
            output.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                alert('复制成功！');
            } catch (error) {
                alert('复制失败: ' + error.message);
            }
        });

        // 清空事件
        document.getElementById('clearBtn').addEventListener('click', function() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
        });
    </script>
</body>
</html>
