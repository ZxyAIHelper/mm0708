<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进制转换器</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #64748b;
            --accent-color: #06b6d4;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-bg: #f8fafc;
            --dark-bg: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--light-bg);
        }

        /* 导航栏 */
        nav {
            background-color: var(--card-bg);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 页面标题 */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* 工具容器 */
        .tool-container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        /* 工具工具栏 */
        .tool-toolbar {
            background-color: var(--light-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 0.5rem 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .toolbar-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toolbar-btn.primary:hover {
            background-color: #4338ca;
        }

        /* 工具内容区域 */
        .tool-content {
            padding: 1rem;
        }

        /* 进制转换区域 */
        .converter-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        /* 进制输入框 */
        .base-input {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .base-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .base-textarea {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            resize: vertical;
            transition: var(--transition);
        }

        .base-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .base-textarea.readonly {
            background-color: var(--light-bg);
            cursor: not-allowed;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        /* 错误信息 */
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--danger-color);
        }

        /* 成功信息 */
        .success-message {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border-left: 4px solid var(--success-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .converter-container {
                grid-template-columns: 1fr;
            }

            .base-textarea {
                min-height: 100px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <a href="../../index.html" class="logo">工具门户</a>
            <ul class="nav-links">
                <li><a href="../../index.html" class="nav-link">首页</a></li>
                <li><a href="../markdown-editor/index.html" class="nav-link">Markdown编辑器</a></li>
                <li><a href="../base64-converter/index.html" class="nav-link">Base64编解码</a></li>
                <li><a href="../json-formatter/index.html" class="nav-link">JSON格式化</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container">
        <h1 class="page-title">进制转换器</h1>
        <p class="page-subtitle">支持多种进制之间的转换，包括二进制、十进制、十六进制等</p>

        <!-- 工具容器 -->
        <div class="tool-container">
            <!-- 工具栏 -->
            <div class="tool-toolbar">
                <button class="toolbar-btn" id="clearBtn">清空</button>
            </div>

            <!-- 工具内容 -->
            <div class="tool-content">
                <!-- 消息区域 -->
                <div id="messageContainer" style="margin-bottom: 1rem;"></div>

                <!-- 进制转换区域 -->
                <div class="converter-container">
                    <!-- 二进制 -->
                    <div class="base-input">
                        <label class="base-label">二进制 (Binary)</label>
                        <textarea class="base-textarea" id="binaryInput" placeholder="请输入二进制数..." oninput="convertFrom('binary')"></textarea>
                    </div>

                    <!-- 八进制 -->
                    <div class="base-input">
                        <label class="base-label">八进制 (Octal)</label>
                        <textarea class="base-textarea" id="octalInput" placeholder="请输入八进制数..." oninput="convertFrom('octal')"></textarea>
                    </div>

                    <!-- 十进制 -->
                    <div class="base-input">
                        <label class="base-label">十进制 (Decimal)</label>
                        <textarea class="base-textarea" id="decimalInput" placeholder="请输入十进制数..." oninput="convertFrom('decimal')"></textarea>
                    </div>

                    <!-- 十六进制 -->
                    <div class="base-input">
                        <label class="base-label">十六进制 (Hexadecimal)</label>
                        <textarea class="base-textarea" id="hexInput" placeholder="请输入十六进制数..." oninput="convertFrom('hex')"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 显示消息
        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}-message">${message}</div>`;
            
            // 3秒后自动隐藏
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // 清空所有输入
        function clearAll() {
            document.getElementById('binaryInput').value = '';
            document.getElementById('octalInput').value = '';
            document.getElementById('decimalInput').value = '';
            document.getElementById('hexInput').value = '';
            document.getElementById('messageContainer').innerHTML = '';
        }

        // 从指定进制转换到其他进制
        function convertFrom(base) {
            const inputElements = {
                binary: document.getElementById('binaryInput'),
                octal: document.getElementById('octalInput'),
                decimal: document.getElementById('decimalInput'),
                hex: document.getElementById('hexInput')
            };

            // 获取输入值
            const inputValue = inputElements[base].value.trim();
            
            // 如果输入为空，清空所有输出
            if (!inputValue) {
                Object.keys(inputElements).forEach(key => {
                    if (key !== base) {
                        inputElements[key].value = '';
                    }
                });
                return;
            }

            let decimalValue;
            
            try {
                // 转换为十进制
                switch (base) {
                    case 'binary':
                        decimalValue = parseInt(inputValue, 2);
                        if (isNaN(decimalValue)) throw new Error('无效的二进制数');
                        break;
                    case 'octal':
                        decimalValue = parseInt(inputValue, 8);
                        if (isNaN(decimalValue)) throw new Error('无效的八进制数');
                        break;
                    case 'decimal':
                        decimalValue = parseInt(inputValue, 10);
                        if (isNaN(decimalValue)) throw new Error('无效的十进制数');
                        break;
                    case 'hex':
                        decimalValue = parseInt(inputValue, 16);
                        if (isNaN(decimalValue)) throw new Error('无效的十六进制数');
                        break;
                }

                // 转换到其他进制
                inputElements.binary.value = decimalValue.toString(2);
                inputElements.octal.value = decimalValue.toString(8);
                inputElements.decimal.value = decimalValue.toString(10);
                inputElements.hex.value = decimalValue.toString(16).toUpperCase();
                
                showMessage('转换成功！', 'success');
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        // 事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            // 清空按钮
            document.getElementById('clearBtn').addEventListener('click', clearAll);
        });
    </script>
</body>
</html>
